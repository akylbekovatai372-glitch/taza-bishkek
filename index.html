<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taza Bishkek — карта проблемных точек</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-icon">🌿</span>
    <div>
      <h1>Taza Bishkek</h1>
      <p class="brand-subtitle">Чистый город начинается с тебя</p>
    </div>
  </div>

<nav class="main-nav">

<a href="home.html" class="back-home">← На главную</a>

  <button type="button" data-v="map" class="on">
    🗺️ Карта проблем
  </button>
  <button type="button" data-v="mod">
    🛡️ Панель модератора
  </button>
</nav>
</header>
<main>
<div id="map"></div>
<aside>
 <section id="v-map">
  <details class="map-filters" open>
   <summary>Фильтры карты</summary>
   <form id="mapFilters">
    <label>Статус<select name="status"><option value="active">Все незавершённые</option><option value="all">Все статусы</option><option>Новая</option><option>Проверена</option><option>В работе</option><option>Убрано</option></select></label>
    <label>Категория<select name="type"><option value="">Все категории</option><option>Стихийная свалка</option><option>Переполненный контейнер</option></select></label>
    <label>Начиная с даты<input name="since" type="date"></label>
    <button type="reset">Сбросить фильтры</button>
   </form>
   <p id="filterCount" role="status" aria-live="polite"></p>
  </details>
  <h2>Сообщить о точке</h2>
  <div id="legend"></div>
  <p class="hint">Нажмите на карте место или <button id="geo" type="button">моё местоположение</button></p>
  <form id="form">
   <select name="type" required><option value="">Тип проблемы</option><option>Стихийная свалка</option><option>Переполненный контейнер</option></select>
   <textarea name="desc" placeholder="Описание (без имён и телефонов)"></textarea>
   <input type="file" name="photo" accept="image/*">
   <div id="dup" class="warn" hidden></div>
   <button type="submit">Отправить заявку</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
 </section>
 <section id="v-mod" hidden>
  <div class="mod-heading"><div><p class="mod-eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</p><h2>Модерация заявок</h2><p id="modHelp" class="hint"></p></div><button id="logoutBtn" type="button" hidden>Выйти</button></div>
  <form id="login">
   <label>Email модератора<input id="email" type="email" autocomplete="username" required></label>
   <label>Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
   <button id="loginBtn" type="submit">Войти</button>
  </form>
  <div id="modWorkspace" hidden>
   <div id="modSummary" class="mod-summary"></div>
   <div class="mod-toolbar">
    <label class="mod-search">Поиск<input id="modSearch" type="search" placeholder="TB-012, категория или описание"></label>
    <label>Статус<select id="modStatus"><option value="active">Незавершённые</option><option value="all">Все статусы</option><option>Новая</option><option>Проверена</option><option>В работе</option><option>Убрано</option></select></label>
    <label>Порядок<select id="modSort"><option value="new">Сначала новые</option><option value="old">Сначала старые</option></select></label>
    <button id="modRefresh" type="button">Обновить</button>
   </div>
   <p id="modMessage" role="status" aria-live="polite"></p>
   <p id="modCount" class="hint" role="status" aria-live="polite"></p>
   <div id="list" hidden></div>
   <div class="mod-pagination"><button id="modPrev" type="button">← Назад</button><span id="modPage"></span><button id="modNext" type="button">Далее →</button></div>
  </div>
 </section>
</aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=6"></script>
</body></html>
